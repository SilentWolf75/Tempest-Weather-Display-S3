name: Firmware and regression checks
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install platformio==6.1.18
      - run: pio run -e esp32-s3-amoled-175 -e esp32-p4-lcd-4c
      - run: python tools/run_tests.py
      - run: python tools/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: tempest-weather-firmware
          path: dist/release-v*/
