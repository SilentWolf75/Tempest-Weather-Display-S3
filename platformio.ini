[env:esp32-s3-amoled-175]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_src_filter = +<*> -<display_p4.*> -<touch_gt911.*> -<p4_shims.*> -<boards/> -<fonts/> +<fonts/montserrat_64_digits.c>

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_WAVESHARE_S3_AMOLED_175
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DLV_CONF_INCLUDE_SIMPLE
    -I"${PROJECT_DIR}/include"
    -std=gnu++17
build_unflags = -std=gnu++11

lib_deps =
    moononournation/GFX Library for Arduino @ 1.6.4
    lvgl/lvgl @ 8.4.0
    bblanchon/ArduinoJson @ ^7.0.4
    https://github.com/tzapu/WiFiManager.git

[env:esp32-p4-lcd-4c]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = waveshare_esp32p4_wifi6_4c
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
board_build.partitions = default_16MB.csv

build_src_filter = +<*> -<display.cpp> -<touch_cst9217.*> -<boards/> -<fonts/> +<fonts/montserrat_64_digits.c> +<fonts/montserrat_96_digits.c>

build_flags =
    -DBOARD_WAVESHARE_P4_LCD_4C
    -DCORE_DEBUG_LEVEL=0
    -DLV_CONF_INCLUDE_SIMPLE
    -I"${PROJECT_DIR}/include"
    -std=gnu++17
build_unflags = -std=gnu++11

lib_deps =
    lvgl/lvgl @ 8.4.0
    bblanchon/ArduinoJson @ ^7.0.4
